[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textbook-extraction-audit"
version = "0.1.0"
description = "Deterministic page-aware extraction audit for Class 10 textbooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=5,<7"]

[project.scripts]
textbook-audit = "textbook_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
