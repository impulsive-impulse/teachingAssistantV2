[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textbook-extraction-audit"
version = "0.1.0"
description = "Deterministic page-aware extraction audit for Class 10 textbooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pypdf>=5,<7",
  "psutil>=7,<8",
  "PyYAML>=6,<7",
  "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
online-generation = [
  # Kept optional so retrieval and local-generation workflows do not require
  # network-provider dependencies. The runner imports this SDK only after its
  # explicit paid-execution gate has passed.
  "openai>=1.66,<3",
]
experiment-m3 = [
  "FlagEmbedding>=1.3,<2",
]
experiment-nomic = [
  # Nomic's pinned custom encoder implementation imports einops at load time.
  "einops>=0.7,<1",
]
visual-assets = [
  "Pillow>=10,<13",
]

[project.scripts]
textbook-audit = "textbook_audit.cli:main"
page-retrieval = "textbook_audit.retrieval:main"
chunk-retrieval = "textbook_audit.chunk_retrieval:main"
hierarchical-retrieval = "textbook_audit.hierarchical_retrieval:main"
candidate-complementarity = "textbook_audit.candidate_complementarity:main"
local-reranker = "textbook_audit.reranker:main"
candidate-compression = "textbook_audit.candidate_compression:main"
candidate-representation = "textbook_audit.candidate_representation:main"
fusion-reranking = "textbook_audit.fusion_reranking:main"
reranker-bakeoff = "textbook_audit.reranker_bakeoff:main"
embedding-bakeoff = "textbook_audit.embedding_bakeoff:main"
chunking-bakeoff = "textbook_audit.chunking_bakeoff:main"
query-processing = "textbook_audit.query_processing:main"
specialist-retrieval = "textbook_audit.specialist_retrieval:main"
extract-visual-assets = "textbook_audit.visual_assets:main"
evidence-sets = "textbook_audit.evidence_sets:main"
context-assembly = "textbook_audit.context_assembly:main"
query-final-pipeline = "textbook_audit.retrieval_baseline:main"
retrieval-baseline-v1 = "textbook_audit.retrieval_baseline:main"
manage-retrieval-baseline-v1 = "textbook_audit.baseline_freeze:main"
finalize-experiments = "textbook_audit.finalize_experiments:main"
generation-phase-a = "textbook_audit.generation_phase_a:main"
generation-experiment = "textbook_audit.generation_experiments:main"
openai-generation-experiment = "textbook_audit.openai_generation:main"
openai-generation-report = "textbook_audit.openai_generation_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The repository carries an unpacked x64 Python runtime under temp/ for local
# model inference.  Restrict discovery so pytest never collects dependency
# suites from that runtime when invoked at the repository root.
testpaths = ["tests"]
